<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plant Identifier AI</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%2322432f' stroke='%23b8863b' stroke-width='2'/%3E%3Cpath d='M32 46 C32 46 18 40 18 25 C18 16 24 10 32 10 C40 10 46 16 46 25 C46 40 32 46 32 46 Z' fill='%23d9ac67' stroke='%23faf6ec' stroke-width='1.2'/%3E%3C/svg%3E" />
<style>
/* =========================================================
   PLANT IDENTIFIER AI - CLASSIC THEME
   A warm, botanical "classic" palette: deep forest green,
   parchment cream, aged gold accents, serif headings.
   ========================================================= */

:root {
  --forest: #22432f;
  --forest-dark: #16301f;
  --forest-light: #35604a;
  --gold: #b8863b;
  --gold-light: #d9ac67;
  --cream: #faf6ec;
  --cream-dark: #f0e9d8;
  --paper: #ffffff;
  --ink: #24291f;
  --ink-soft: #5a5f4f;
  --border: #e0d7bd;
  --danger: #a3372f;
  --success: #3f7d4e;
  --shadow: 0 4px 18px rgba(34, 67, 47, 0.10);
  --radius: 10px;
  --serif: 'Georgia', 'Times New Roman', serif;
  --sans: 'Segoe UI', Tahoma, Verdana, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100vh;
}

h1, h2, h3, h4 {
  font-family: var(--serif);
  color: var(--forest-dark);
  margin: 0 0 0.5em 0;
}

a { color: var(--forest); }

p { line-height: 1.6; }

/* ---------- Layout shell ---------- */

.app-shell {
  display: flex;
  min-height: 100vh;
}

.topbar {
  background: linear-gradient(180deg, var(--forest) 0%, var(--forest-dark) 100%);
  color: var(--cream);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--cream);
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
}

.brand-logo { width: 34px; height: 34px; flex-shrink: 0; }

.brand-name {
  font-family: var(--serif);
  font-size: 1.25rem;
  letter-spacing: 0.5px;
}

.brand-tag {
  font-size: 0.68rem;
  color: var(--gold-light);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  display: block;
  margin-top: -2px;
}

.topbar-user {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.9rem;
}

.avatar-badge {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--gold);
  color: var(--forest-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  border: 2px solid var(--gold-light);
}

/* ---------- Sidebar nav (modules) ---------- */

.sidebar {
  width: 230px;
  background: var(--paper);
  border-right: 1px solid var(--border);
  padding: 18px 10px;
  flex-shrink: 0;
}

.sidebar nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  margin-bottom: 4px;
  border-radius: var(--radius);
  color: var(--ink);
  text-decoration: none;
  font-size: 0.92rem;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
  cursor: pointer;
}

.sidebar nav a:hover { background: var(--cream-dark); }

.sidebar nav a.active {
  background: var(--cream-dark);
  border-left-color: var(--gold);
  color: var(--forest-dark);
  font-weight: 600;
}

.sidebar nav .icon { font-size: 1.1rem; width: 22px; text-align: center; }

.main-content {
  flex: 1;
  padding: 28px 32px;
  max-width: 1100px;
}

/* ---------- Cards / panels ---------- */

.card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.card-header .icon-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--forest);
  color: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
}

.grid {
  display: grid;
  gap: 18px;
}

.grid-2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

/* ---------- Forms ---------- */

label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--forest-dark);
  margin: 12px 0 5px;
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="number"],
input[type="date"],
select,
textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--cream);
  font-family: var(--sans);
  font-size: 0.95rem;
  color: var(--ink);
}

textarea { resize: vertical; min-height: 90px; }

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(184, 134, 59, 0.18);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  font-family: var(--sans);
  transition: transform 0.08s ease, opacity 0.15s;
  text-decoration: none;
}

.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-primary { background: var(--forest); color: var(--cream); }
.btn-primary:hover { background: var(--forest-light); }

.btn-gold { background: var(--gold); color: var(--forest-dark); }
.btn-gold:hover { background: var(--gold-light); }

.btn-outline {
  background: transparent;
  border: 1.5px solid var(--forest);
  color: var(--forest);
}
.btn-outline:hover { background: var(--cream-dark); }

.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.9; }

.btn-block { width: 100%; }
.btn-sm { padding: 6px 12px; font-size: 0.82rem; }

/* ---------- Auth pages ---------- */

.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top, #345c40 0%, var(--forest-dark) 65%);
  padding: 20px;
}

.auth-card {
  background: var(--cream);
  border-radius: 14px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  padding: 36px 34px;
  width: 100%;
  max-width: 400px;
}

.auth-card .brand { color: var(--forest-dark); justify-content: center; margin-bottom: 6px; }
.auth-card .brand-tag { color: var(--gold); }
.auth-subtitle {
  text-align: center;
  color: var(--ink-soft);
  font-size: 0.88rem;
  margin-bottom: 20px;
}

.auth-footer {
  text-align: center;
  margin-top: 18px;
  font-size: 0.88rem;
  color: var(--ink-soft);
}

/* ---------- Misc components ---------- */

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.badge-low, .badge-none { background: #e3efe2; color: var(--success); }
.badge-moderate { background: #fbeecd; color: #8a5f10; }
.badge-high { background: #f6dcd9; color: var(--danger); }

.alert {
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 0.9rem;
  margin-bottom: 14px;
}
.alert-error { background: #f8e3e1; color: var(--danger); border: 1px solid #e6b7b1; }
.alert-success { background: #e2efe0; color: var(--success); border: 1px solid #b9dcb6; }
.alert-info { background: #eef2e8; color: var(--forest-dark); border: 1px solid var(--border); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-soft);
}
.empty-state .icon { font-size: 2.4rem; margin-bottom: 10px; }

.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 3px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.divider {
  height: 1px;
  background: var(--border);
  margin: 18px 0;
}

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
th { color: var(--forest-dark); font-family: var(--serif); }

.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
  background: var(--cream);
}

.chat-window {
  height: 420px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.chat-bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 0.92rem;
  line-height: 1.5;
  white-space: pre-wrap;
}
.chat-bubble.user {
  align-self: flex-end;
  background: var(--forest);
  color: var(--cream);
  border-bottom-right-radius: 3px;
}
.chat-bubble.assistant {
  align-self: flex-start;
  background: var(--paper);
  border: 1px solid var(--border);
  border-bottom-left-radius: 3px;
}

.upload-zone {
  border: 2px dashed var(--gold);
  border-radius: var(--radius);
  padding: 30px;
  text-align: center;
  cursor: pointer;
  background: var(--cream-dark);
  color: var(--ink-soft);
}
.upload-zone:hover { background: #f2ead2; }
.preview-img {
  max-width: 100%;
  max-height: 320px;
  border-radius: 8px;
  margin-top: 14px;
  border: 1px solid var(--border);
}

.stat-box {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  text-align: center;
}
.stat-box .num { font-family: var(--serif); font-size: 1.8rem; color: var(--forest); }
.stat-box .label { font-size: 0.8rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; }

.lang-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
.lang-toggle button {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: 1.5px solid var(--forest);
  background: transparent;
  color: var(--forest);
  cursor: pointer;
  font-weight: 600;
}
.lang-toggle button.active { background: var(--forest); color: var(--cream); }

.urdu-text { direction: rtl; text-align: right; font-family: 'Noto Nastaliq Urdu', var(--serif); }

@media (max-width: 820px) {
  .app-shell { flex-direction: column; }
  .sidebar { width: 100%; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .sidebar nav { display: flex; gap: 4px; }
  .main-content { padding: 20px 16px; }
}
</style>
</head>
<body>

<div id="root"></div>

<script>
/**
 * =========================================================
 * PLANT IDENTIFIER AI — single-file web client
 * =========================================================
 * This bundles all pages (login, register, dashboard,
 * identify, disease, essay, chat, reminders, history,
 * profile, encyclopedia) into one HTML file using hash-based
 * client-side routing.
 *
 * IMPORTANT: this file is the FRONTEND only. It still calls a
 * backend at `${API_BASE}` (relative path "/api" by default)
 * for auth, the database, and the Gemini AI calls — those
 * cannot run inside a static HTML file (they need a real
 * server and a private API key). Serve this file from the
 * same origin as the included Node/Express backend, or edit
 * API_BASE below to point at wherever you host that backend.
 * ========================================================= */

const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="34" height="34">
  <circle cx="32" cy="32" r="31" fill="#22432f" stroke="#b8863b" stroke-width="2"/>
  <path d="M32 46 C32 46 18 40 18 25 C18 16 24 10 32 10 C40 10 46 16 46 25 C46 40 32 46 32 46 Z"
        fill="#d9ac67" stroke="#faf6ec" stroke-width="1.2"/>
  <path d="M32 44 C32 44 32 22 32 12" stroke="#22432f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M32 32 C32 32 24 28 22 22" stroke="#22432f" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M32 26 C32 26 40 22 42 17" stroke="#22432f" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M32 38 C32 38 24 35 21 30" stroke="#22432f" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>`;

/* ---------- SHARED: API client / auth ---------- */

const API_BASE = '/api';
const TOKEN_KEY = 'pia_token';
const USER_KEY = 'pia_user';

const Auth = {
  getToken() { return localStorage.getItem(TOKEN_KEY); },
  setToken(token) { localStorage.setItem(TOKEN_KEY, token); },
  clearToken() { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); },
  getUser() {
    try { return JSON.parse(localStorage.getItem(USER_KEY) || 'null'); }
    catch (e) { return null; }
  },
  setUser(user) { localStorage.setItem(USER_KEY, JSON.stringify(user)); },
  isLoggedIn() { return Boolean(this.getToken()); }
};

async function apiFetch(path, { method = 'GET', body, auth = true } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth) {
    const token = Auth.getToken();
    if (token) headers['Authorization'] = `Bearer ${token}`;
  }

  let res;
  try {
    res = await fetch(`${API_BASE}${path}`, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined
    });
  } catch (networkErr) {
    throw new Error('Could not reach the server. Please check your connection and try again.');
  }

  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body is fine */ }

  if (res.status === 401 && auth) {
    Auth.clearToken();
    if (location.hash !== '#/login') go('/login');
  }

  if (!res.ok) {
    throw new Error(data.error || `Request failed (${res.status})`);
  }
  return data;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showAlert(container, message, type = 'error') {
  if (!container) return;
  container.innerHTML = `<div class="alert alert-${type}">${escapeHtml(message)}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function formatDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function formatDateTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

/* ---------- SHARED: router ---------- */

function go(path) { location.hash = `#${path}`; }

const NAV_LINKS = [
  { path: '/dashboard', icon: '🏠', label: 'Dashboard', key: 'dashboard' },
  { path: '/identify', icon: '🔍', label: 'Identify Plant', key: 'identify' },
  { path: '/disease', icon: '🩺', label: 'Plant Doctor', key: 'disease' },
  { path: '/essay', icon: '📖', label: 'Botanical Essay', key: 'essay' },
  { path: '/chat', icon: '💬', label: 'Botanist Chat', key: 'chat' },
  { path: '/reminders', icon: '⏰', label: 'Care Reminders', key: 'reminders' },
  { path: '/history', icon: '🗂️', label: 'History', key: 'history' },
  { path: '/encyclopedia', icon: '🌿', label: 'Encyclopedia', key: 'encyclopedia' },
  { path: '/profile', icon: '👤', label: 'My Profile', key: 'profile' }
];

function renderLayout(activeKey, innerHtml) {
  const user = Auth.getUser();
  const initials = (user && user.name ? user.name.trim().charAt(0).toUpperCase() : '?');

  const navHtml = NAV_LINKS.map(link => `
    <a data-nav="${link.path}" class="${link.key === activeKey ? 'active' : ''}">
      <span class="icon">${link.icon}</span><span>${link.label}</span>
    </a>
  `).join('');

  document.getElementById('root').innerHTML = `
    <header class="topbar">
      <button data-nav="/dashboard" class="brand">
        ${LOGO_SVG}
        <span>
          <span class="brand-name">Plant Identifier AI</span>
          <span class="brand-tag">Classic Botanical Edition</span>
        </span>
      </button>
      <div class="topbar-user">
        <span>${user ? escapeHtml(user.name) : ''}</span>
        <div class="avatar-badge">${initials}</div>
        <button class="btn btn-outline btn-sm" id="logoutBtn" style="color:#faf6ec;border-color:#d9ac67;">Log out</button>
      </div>
    </header>
    <div class="app-shell">
      <aside class="sidebar"><nav>${navHtml}</nav></aside>
      <main class="main-content" id="mainContent">${innerHtml}</main>
    </div>
  `;

  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => go(el.getAttribute('data-nav')));
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { await apiFetch('/auth/logout', { method: 'POST' }); } catch (e) { /* ignore */ }
    Auth.clearToken();
    go('/login');
  });
}

/* ---------- PAGE: Login ---------- */

function pageLogin() {
  document.getElementById('root').innerHTML = `
    <div class="auth-page">
      <div class="auth-card">
        <div class="brand">${LOGO_SVG}
          <span>
            <span class="brand-name">Plant Identifier AI</span>
            <span class="brand-tag">Classic Botanical Edition</span>
          </span>
        </div>
        <p class="auth-subtitle">Welcome back, gardener. Log in to continue.</p>
        <div id="alertBox"></div>
        <form id="loginForm">
          <label for="email">Email address</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;" id="submitBtn">Log In</button>
        </form>
        <div class="auth-footer">
          <a data-nav="/forgot-password">Forgot your password?</a>
          <div class="divider"></div>
          Don't have an account? <a data-nav="/register">Create one</a>
        </div>
      </div>
    </div>
  `;
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => go(el.getAttribute('data-nav')));
  });

  const loginForm = document.getElementById('loginForm');
  const alertBox = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.innerHTML = '';
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Logging in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const data = await apiFetch('/auth/login', { method: 'POST', body: { email, password }, auth: false });
      Auth.setToken(data.token);
      Auth.setUser(data.user);
      go('/dashboard');
    } catch (err) {
      showAlert(alertBox, err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
}

/* ---------- PAGE: Register ---------- */

function pageRegister() {
  document.getElementById('root').innerHTML = `
    <div class="auth-page">
      <div class="auth-card">
        <div class="brand">${LOGO_SVG}
          <span>
            <span class="brand-name">Plant Identifier AI</span>
            <span class="brand-tag">Classic Botanical Edition</span>
          </span>
        </div>
        <p class="auth-subtitle">Create your gardener account.</p>
        <div id="alertBox"></div>
        <form id="registerForm">
          <label for="name">Full name</label>
          <input type="text" id="name" required autocomplete="name" placeholder="Jane Gardener" />
          <label for="email">Email address</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="new-password" placeholder="At least 6 characters" minlength="6" />
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" required autocomplete="new-password" placeholder="Repeat your password" minlength="6" />
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;" id="submitBtn">Create Account</button>
        </form>
        <div class="auth-footer">
          Already have an account? <a data-nav="/login">Log in</a>
        </div>
      </div>
    </div>
  `;
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => go(el.getAttribute('data-nav')));
  });

  const registerForm = document.getElementById('registerForm');
  const alertBox = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.innerHTML = '';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      showAlert(alertBox, 'Passwords do not match.');
      return;
    }

    submitBtn.disabled = true;

function pageChat() {
  renderLayout('chat', `
    <div class="card">
      <div class="card-header">
        <div class="icon-circle">💬</div>
        <div>
          <h2 style="margin:0;">Chat with Sprout</h2>
          <p style="margin:0;color:var(--ink-soft);">Your 24/7 AI botanist. Ask anything about plant care.</p>
        </div>
        <button class="btn btn-outline btn-sm" id="clearBtn" style="margin-left:auto;">Clear Chat</button>
      </div>
      <div id="alertBox"></div>
      <div class="chat-window" id="chatWindow"></div>
      <form id="chatForm" style="display:flex;gap:10px;margin-top:14px;">
        <input type="text" id="messageInput" placeholder="Ask about watering, pests, soil..." style="flex:1;" autocomplete="off" />
        <button type="submit" class="btn btn-primary" id="sendBtn">Send</button>
      </form>
    </div>
  `);

  const chatWindow = document.getElementById('chatWindow');
  const chatForm = document.getElementById('chatForm');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const alertBox = document.getElementById('alertBox');
  const clearBtn = document.getElementById('clearBtn');

  function appendBubble(role, text) {
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${role}`;
    bubble.textContent = text;
    chatWindow.appendChild(bubble);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  async function loadHistory() {
    try {
      const { messages } = await apiFetch('/chat');
      if (messages.length === 0) {
        appendBubble('assistant', "Hi, I'm Sprout 🌱 — your AI botanist. Ask me about watering, pests, soil, or anything plant-related!");
        return;
      }
      messages.forEach(m => appendBubble(m.role, m.text));
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  }

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = messageInput.value.trim();
    if (!message) return;
    appendBubble('user', message);
    messageInput.value = '';
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<span class="spinner"></span>';
    alertBox.innerHTML = '';

    try {
      const { reply } = await apiFetch('/chat', { method: 'POST', body: { message } });
      appendBubble('assistant', reply);
    } catch (err) {
      showAlert(alertBox, err.message);
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
    }
  });

  clearBtn.addEventListener('click', async () => {
    if (!confirm('Clear your entire chat history?')) return;
    try {
      await apiFetch('/chat/clear', { method: 'DELETE' });
      chatWindow.innerHTML = '';
      appendBubble('assistant', "Chat cleared. What would you like to talk about?");
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  });

  loadHistory();
}

        </div>
        <div>
          <label for="type">Reminder type</label>
          <select id="type">
            <option value="watering">Watering</option>
            <option value="fertilizing">Fertilizing</option>
            <option value="repotting">Repotting</option>
            <option value="pruning">Pruning</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>
          <label for="intervalDays">Repeat every (days)</label>
          <input type="number" id="intervalDays" min="1" value="7" />
        </div>
        <div>
          <label for="notes">Notes (optional)</label>
          <input type="text" id="notes" placeholder="e.g. use rainwater" />
        </div>
      </form>
      <button class="btn btn-primary" id="addBtn" style="margin-top:14px;">Add Reminder</button>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="icon-circle">🗓️</div>
        <h3 style="margin:0;">Your Reminders</h3>
      </div>
      <div id="reminderList"></div>
    </div>
  `);

  const alertBox = document.getElementById('alertBox');
  const addBtn = document.getElementById('addBtn');
  const reminderList = document.getElementById('reminderList');

  addBtn.addEventListener('click', async () => {
    const plantName = document.getElementById('plantName').value.trim();
    const type = document.getElementById('type').value;
    const intervalDays = document.getElementById('intervalDays').value;
    const notes = document.getElementById('notes').value.trim();

    if (!plantName) {
      showAlert(alertBox, 'Please enter a plant name.');
      return;
    }
    addBtn.disabled = true;
    addBtn.innerHTML = '<span class="spinner"></span> Adding...';
    alertBox.innerHTML = '';

    try {
      await apiFetch('/reminders', { method: 'POST', body: { plantName, type, intervalDays, notes } });
      document.getElementById('plantName').value = '';
      document.getElementById('notes').value = '';
      loadReminders();
    } catch (err) {
      showAlert(alertBox, err.message);
    } finally {
      addBtn.disabled = false;
      addBtn.textContent = 'Add Reminder';
    }
  });

  const TYPE_ICONS = { watering: '💧', fertilizing: '🌾', repotting: '🪴', pruning: '✂️', other: '📌' };

  async function loadReminders() {
    try {
      const { reminders } = await apiFetch('/reminders');
      if (reminders.length === 0) {
        reminderList.innerHTML = `<div class="empty-state"><div class="icon">🌼</div>No reminders yet. Add your first one above.</div>`;
        return;
      }
      const now = Date.now();
      reminderList.innerHTML = reminders.map(r => {
        const overdue = r.nextDue < now;
        return `
        <div class="list-item">
          <div>
            <strong>${TYPE_ICONS[r.type] || '📌'} ${escapeHtml(r.plantName)}</strong>
            <div style="font-size:0.82rem;color:${overdue ? 'var(--danger)' : 'var(--ink-soft)'};">
              ${escapeHtml(r.type)} every ${r.intervalDays}d · ${overdue ? 'Overdue since' : 'Due'} ${formatDate(r.nextDue)}
              ${r.notes ? ' · ' + escapeHtml(r.notes) : ''}
            </div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-gold btn-sm" data-done="${r.id}">Done</button>
            <button class="btn btn-danger btn-sm" data-delete="${r.id}">Delete</button>
          </div>
        </div>`;
      }).join('');

      reminderList.querySelectorAll('[data-done]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await apiFetch(`/reminders/${btn.dataset.done}/complete`, { method: 'POST' });
            loadReminders();
          } catch (err) { showAlert(alertBox, err.message); }
        });
      });
      reminderList.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await apiFetch(`/reminders/${btn.dataset.delete}`, { method: 'DELETE' });
            loadReminders();
          } catch (err) { showAlert(alertBox, err.message); }
        });
      });
    } catch (err) {
      reminderList.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    }
  }

  loadReminders();
}

/* ---------- PAGE: History ---------- */

function pageHistory() {
  renderLayout('history', `
    <div class="card">
      <div class="card-header">
        <div class="icon-circle">🗂️</div>
        <div>
          <h2 style="margin:0;">History</h2>
          <p style="margin:0;color:var(--ink-soft);">Every plant you've identified or diagnosed.</p>
        </div>
      </div>
      <div class="lang-toggle" id="filterToggle">
        <button type="button" class="active" data-filter="all">All</button>
        <button type="button" data-filter="identify">Identifications</button>
        <button type="button" data-filter="disease">Diagnoses</button>
      </div>
      <div id="alertBox"></div>
      <div id="historyList"></div>
    </div>
  `);

  let currentFilter = 'all';
  const alertBox = document.getElementById('alertBox');
  const historyList = document.getElementById('historyList');

  document.querySelectorAll('#filterToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#filterToggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      loadHistory();
    });
  });

  function severityBadgeClass(sev) {
    const s = (sev || '').toLowerCase();
    if (s.includes('high')) return 'badge-high';
    if (s.includes('moderate')) return 'badge-moderate';
    return 'badge-low';
  }

  async function loadHistory() {
    historyList.innerHTML = '<p style="color:var(--ink-soft);">Loading...</p>';
    try {
      const query = currentFilter === 'all' ? '' : `?type=${currentFilter}`;
      const { history } = await apiFetch(`/history${query}`);
      if (history.length === 0) {
        historyList.innerHTML = `<div class="empty-state"><div class="icon">🗂️</div>Nothing here yet. Try <a data-nav="/identify" style="cursor:pointer;">identifying</a> or <a data-nav="/disease" style="cursor:pointer;">diagnosing</a> a plant.</div>`;
        historyList.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => go(el.getAttribute('data-nav'))));
        return;
      }
      historyList.innerHTML = history.map(h => {
        const r = h.result || {};
        if (h.type === 'identify') {
          return `
          <div class="list-item">
            <div>
              <strong>🔍 ${escapeHtml(r.name || 'Unknown plant')}</strong>
              <div style="font-size:0.82rem;color:var(--ink-soft);font-style:italic;">${escapeHtml(r.scientificName || '')} · ${formatDateTime(h.createdAt)}</div>
            </div>
            <button class="btn btn-danger btn-sm" data-delete="${h.id}">Delete</button>
          </div>`;
        }
        return `
        <div class="list-item">
          <div>
            <strong>🩺 ${escapeHtml(r.diseaseName || 'Unknown issue')}</strong>
            <div style="font-size:0.82rem;color:var(--ink-soft);">
              <span class="badge ${severityBadgeClass(r.severity)}">${escapeHtml(r.severity || '')}</span>
              ${formatDateTime(h.createdAt)}
            </div>
          </div>
          <button class="btn btn-danger btn-sm" data-delete="${h.id}">Delete</button>
        </div>`;
      }).join('');

      historyList.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await apiFetch(`/history/${btn.dataset.delete}`, { method: 'DELETE' });
            loadHistory();
          } catch (err) { showAlert(alertBox, err.message); }
        });
      });
    } catch (err) {
      historyList.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    }
  }

  loadHistory();
}

/* ---------- PAGE: Profile ---------- */

function pageProfile() {
  renderLayout('profile', `
    <div class="card">
      <div class="card-header">
        <div class="icon-circle">👤</div>
        <div>
          <h2 style="margin:0;">My Gardener Profile</h2>
          <p style="margin:0;color:var(--ink-soft);">Update your details and see your gardening stats.</p>
        </div>
      </div>
      <div id="alertBox"></div>
      <div id="statsRow" class="grid grid-3" style="margin-bottom:20px;"></div>
      <form id="profileForm">
        <label for="name">Full name</label>
        <input type="text" id="name" required />
        <label for="gardenerLevel">Gardener level</label>
        <select id="gardenerLevel">
          <option>Beginner</option>
          <option>Hobbyist</option>
          <option>Experienced</option>
          <option>Expert</option>
        </select>
        <label for="bio">Bio</label>
        <textarea id="bio" maxlength="500" placeholder="Tell us about your garden..."></textarea>
        <button type="submit" class="btn btn-primary" style="margin-top:16px;" id="saveBtn">Save Changes</button>
      </form>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="icon-circle">🔒</div>
        <h3 style="margin:0;">Account</h3>
      </div>
      <p style="color:var(--ink-soft);">Email: <span id="emailDisplay"></span></p>
      <p style="color:var(--ink-soft);">Member since: <span id="joinedDisplay"></span></p>
      <button class="btn btn-outline" id="logoutBtn2">Log out</button>
    </div>
  `);

  const alertBox = document.getElementById('alertBox');
  const statsRow = document.getElementById('statsRow');
  const profileForm = document.getElementById('profileForm');
  const saveBtn = document.getElementById('saveBtn');

  async function loadProfile() {
    try {
      const { user, stats } = await apiFetch('/users/profile');
      document.getElementById('name').value = user.name || '';
      document.getElementById('gardenerLevel').value = user.gardenerLevel || 'Beginner';
      document.getElementById('bio').value = user.bio || '';
      document.getElementById('emailDisplay').textContent = user.email;
      document.getElementById('joinedDisplay').textContent = formatDate(user.createdAt);
      statsRow.innerHTML = `
        <div class="stat-box"><div class="num">${stats.identifications}</div><div class="label">Identifications</div></div>
        <div class="stat-box"><div class="num">${stats.diagnoses}</div><div class="label">Diagnoses</div></div>
        <div class="stat-box"><div class="num">${stats.reminders}</div><div class="label">Reminders</div></div>
      `;
      Auth.setUser(user);
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  }

  profileForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.innerHTML = '';
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner"></span> Saving...';

    try {
      const { user } = await apiFetch('/users/profile', {
        method: 'PUT',
        body: {
          name: document.getElementById('name').value.trim(),
          gardenerLevel: document.getElementById('gardenerLevel').value,
          bio: document.getElementById('bio').value.trim()
        }
      });
      Auth.setUser(user);
      alertBox.innerHTML = '<div class="alert alert-success">Profile updated.</div>';
    } catch (err) {
      showAlert(alertBox, err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';
    }
  });

  document.getElementById('logoutBtn2').addEventListener('click', async () => {
    try { await apiFetch('/auth/logout', { method: 'POST' }); } catch (e) { /* ignore */ }
    Auth.clearToken();
    go('/login');
  });

  loadProfile();
}

/* ---------- PAGE: Encyclopedia ---------- */

function pageEncyclopedia() {
  renderLayout('encyclopedia', `
    <div class="card">
      <div class="card-header">
        <div class="icon-circle">🌿</div>
        <div>
          <h2 style="margin:0;">Plant Encyclopedia</h2>
          <p style="margin:0;color:var(--ink-soft);">A bilingual reference library of common plants.</p>
        </div>
      </div>
      <input type="text" id="searchInput" placeholder="Search by name, scientific name, or family..." />
    </div>
    <div id="alertBox"></div>
    <div class="grid grid-2" id="plantGrid"></div>
    <div class="card" id="detailCard" style="display:none;">
      <div class="card-header">
        <div class="icon-circle">📗</div>
        <h3 style="margin:0;" id="detailTitle">Plant Detail</h3>
      </div>
      <div id="detailBody"></div>
    </div>
  `);

  let currentPlants = [];
  let encLang = 'en';
  const alertBox = document.getElementById('alertBox');
  const searchInput = document.getElementById('searchInput');
  const plantGrid = document.getElementById('plantGrid');
  const detailCard = document.getElementById('detailCard');
  const detailTitle = document.getElementById('detailTitle');
  const detailBody = document.getElementById('detailBody');

  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadPlants(searchInput.value.trim()), 250);
  });

  async function loadPlants(search) {
    try {
      const query = search ? `?search=${encodeURIComponent(search)}` : '';
      const { plants } = await apiFetch(`/encyclopedia${query}`);
      currentPlants = plants;
      renderGrid(plants);
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  }

  function renderGrid(plants) {
    if (plants.length === 0) {
      plantGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🌱</div>No plants matched your search.</div>`;
      return;
    }
    plantGrid.innerHTML = plants.map(p => `
      <div class="card" style="cursor:pointer;margin-bottom:0;" data-plant="${p.id}">
        <h3 style="margin-bottom:2px;">${escapeHtml(p.name)}</h3>
        <p style="font-style:italic;color:var(--ink-soft);margin:0 0 8px;">${escapeHtml(p.scientificName || '')} · ${escapeHtml(p.family || '')}</p>
        <p style="font-size:0.88rem;margin:0;">${escapeHtml((p.description || '').slice(0, 110))}${(p.description || '').length > 110 ? '…' : ''}</p>
      </div>
    `).join('');

    plantGrid.querySelectorAll('[data-plant]').forEach(card => {
      card.addEventListener('click', () => showDetail(card.dataset.plant));
    });
  }

  function showDetail(id) {
    const p = currentPlants.find(x => x.id === id);
    if (!p) return;
    detailTitle.textContent = p.name;
    detailBody.innerHTML = `
      <div class="lang-toggle">
        <button type="button" class="lang-btn ${encLang === 'en' ? 'active' : ''}" data-lang="en">English</button>
        <button type="button" class="lang-btn ${encLang === 'ur' ? 'active' : ''}" data-lang="ur">اردو</button>
      </div>
      <p style="font-style:italic;color:var(--ink-soft);">${escapeHtml(p.scientificName || '')} · ${escapeHtml(p.family || '')}</p>
      <div id="detailLangBody"></div>
    `;
    renderDetailLang(p);
    detailCard.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        encLang = btn.dataset.lang;
        detailCard.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDetailLang(p);
      });
    });
    detailCard.style.display = 'block';
    detailCard.scrollIntoView({ behavior: 'smooth' });
  }

  function renderDetailLang(p) {
    const body = document.getElementById('detailLangBody');
    const isUrdu = encLang === 'ur';
    const desc = isUrdu ? (p.descriptionUrdu || p.description) : p.description;
    const benefits = isUrdu ? (p.benefitsUrdu || p.benefits) : p.benefits;
    const care = isUrdu ? (p.careGuideUrdu || p.careGuide) : p.careGuide;
    const cls = isUrdu ? 'urdu-text' : '';
    body.innerHTML = `
      <p class="${cls}"><strong>${isUrdu ? 'تفصیل' : 'Description'}:</strong> ${escapeHtml(desc || '—')}</p>
      <p class="${cls}"><strong>${isUrdu ? 'فوائد' : 'Benefits'}:</strong> ${escapeHtml(benefits || '—')}</p>
      <p class="${cls}"><strong>${isUrdu ? 'دیکھ بھال' : 'Care Guide'}:</strong> ${escapeHtml(care || '—')}</p>
    `;
  }

  loadPlants('');
}

/* ---------- Router table ---------- */

const ROUTES = {
  '/login': { protected: false, render: pageLogin },
  '/register': { protected: false, render: pageRegister },
  '/forgot-password': { protected: false, render: pageForgotPassword },
  '/dashboard': { protected: true, render: pageDashboard },
  '/identify': { protected: true, render: pageIdentify },
  '/disease': { protected: true, render: pageDisease },
  '/essay': { protected: true, render: pageEssay },
  '/chat': { protected: true, render: pageChat },
  '/reminders': { protected: true, render: pageReminders },
  '/history': { protected: true, render: pageHistory },
  '/profile': { protected: true, render: pageProfile },
  '/encyclopedia': { protected: true, render: pageEncyclopedia }
};

function renderRoute() {
  let path = location.hash.slice(1) || '';
  if (!path) {
    path = Auth.isLoggedIn() ? '/dashboard' : '/login';
    location.hash = `#${path}`;
    return; // hashchange listener will re-invoke renderRoute
  }

  const route = ROUTES[path];
  if (!route) {
    go(Auth.isLoggedIn() ? '/dashboard' : '/login');
    return;
  }

  if (route.protected && !Auth.isLoggedIn()) {
    go('/login');
    return;
  }
  if (!route.protected && (path === '/login' || path === '/register') && Auth.isLoggedIn()) {
    go('/dashboard');
    return;
  }

  route.render();
}

window.addEventListener('hashchange', renderRoute);
renderRoute();
</script>
